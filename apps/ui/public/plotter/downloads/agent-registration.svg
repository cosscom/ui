<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" data-plotter="" data-plotter-unit="24" fill="none" stroke="#171717" stroke-linecap="butt" stroke-linejoin="round" role="img" aria-labelledby="ag01-agent-registration-title" style="color:#171717;font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400" aria-describedby="ag01-agent-registration-desc">
  <title id="ag01-agent-registration-title">An agent, registered</title>
  <desc id="ag01-agent-registration-desc">An identity, name, and two tools align into one registry record. The identity and tool shapes retain their sizes and horizontal positions. The record receives the example identifier agent_07.</desc>
  <metadata>Study: agent-registration, revision 2, explicitly liked by the user on 2026-10-31. Mode: conceptual diagram. Registration is represented as the assembly of one discoverable record from an agent definition; this does not depict authentication, permission grants, or execution. References: C01 assembly, C02 allocation, I06 identity fragments. Local unit u = 24 SVG units. Record width 14u = 336; height 4u = 96; horizontal allocation 1u inset + 2u identity + 1u gap + 5u name + 1u gap + 3u tools + 1u inset. Source and assembled fragments differ only by a vertical translation of 148 units. The assigned identifier is new text within the name allocation. No background grid or hatch is needed.</metadata>

  <!-- Projections follow fragment extents; none retrace a form or cross a label. -->
  <g data-plotter-role="guide" stroke-width="0.6" opacity="0.24" stroke-dasharray="none">
    <path d="M136 152V236M184 152V236M208 180V236M328 180V236M352 180V236M424 180V236" />
    <path d="M136 252V260M184 252V260M208 252V264M328 252V264M352 252V256M424 252V256" />
    <path d="M128 120H136M184 120H192M128 168H136M184 168H192" />
    <path d="M104 268H128M104 316H128M432 264H456M432 320H456M184 308V332M208 324V332M328 316V332M352 316V332" />
  </g>

  <!-- The loose fragments retain the same geometry inside the completed record. -->
  <g data-plotter-role="primary" stroke-width="0.95" opacity="1" stroke-dasharray="none">
    <circle cx="160" cy="144" r="24" />
    <rect x="352" y="116" width="72" height="24" rx="12" />
    <rect x="352" y="148" width="72" height="24" rx="12" />
  </g>
  <g data-plotter-role="secondary" stroke-width="0.65" opacity="0.5" stroke-dasharray="none">
    <circle cx="160" cy="137" r="5" />
    <path d="M148 156A12 12 0 0 1 172 156" />
    <path d="M208 168V176M208 172H328M328 168V176" />
  </g>
  <g fill="#171717" stroke="none" font-size="11" opacity="0.72">
    <text x="208" y="148" font-size="12">Research agent</text>
    <text x="388" y="132" text-anchor="middle">Read</text>
    <text x="388" y="164" text-anchor="middle">Search</text>
  </g>
  <g fill="#171717" stroke="none" font-size="10" opacity="0.5" text-anchor="middle">
    <text x="160" y="94">Identity</text>
    <text x="268" y="94">Name</text>
    <text x="388" y="94">Tools</text>
  </g>

  <!-- One movement cue expresses assembly; the edge projections express fit. -->
  <!-- plotter:registration-transfer -->
  <g data-plotter-role="transfer" stroke-width="0.65" opacity="0.5" stroke-dasharray="4 6">
    <path d="M268 212L268 186" />
    <path d="M263.757359 207.757359L268 212L272.242641 207.757359" stroke-dasharray="none" />
  </g>
  <!-- /plotter:registration-transfer -->
  <text x="280" y="234" fill="#171717" stroke="none" font-size="11" opacity="0.72" text-anchor="middle">Registered agent</text>

  <g data-plotter-role="primary" stroke-width="0.95" opacity="1" stroke-dasharray="none">
    <rect data-plotter-part="registry-record" x="112" y="244" width="336" height="96" rx="12" />
    <circle cx="160" cy="292" r="24" />
    <rect x="352" y="264" width="72" height="24" rx="12" />
    <rect x="352" y="296" width="72" height="24" rx="12" />
  </g>
  <g data-plotter-role="secondary" stroke-width="0.65" opacity="0.5" stroke-dasharray="none">
    <circle cx="160" cy="285" r="5" />
    <path d="M148 304A12 12 0 0 1 172 304" />
  </g>
  <g fill="#171717" stroke="none" font-size="11" opacity="0.72">
    <text x="208" y="296" font-size="12">Research agent</text>
    <text x="388" y="280" text-anchor="middle">Read</text>
    <text x="388" y="312" text-anchor="middle">Search</text>
  </g>
  <text x="208" y="314" fill="#171717" stroke="none" font-size="10" opacity="0.72" style="font-variation-settings:'GEOM' 0">agent_07</text>

  <!-- Witnesses measure the frame width and both equal 24-unit allocation gaps. -->
  <g data-plotter-role="dimension" stroke-width="0.65" opacity="0.5" stroke-dasharray="none">
    <!-- plotter:registration-width -->
    <path d="M112 348L112 398 M448 348L448 398 M112 390L264 390 M296 390L448 390 M108 394L116 386 M444 394L452 386" />
