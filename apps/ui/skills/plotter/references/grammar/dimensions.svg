<svg xmlns="http://www.w3.org/2000/svg" id="plotter-grammar-dimensions" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" role="img" aria-labelledby="dimensions-title dimensions-desc" style="font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:&quot;GEOM&quot; 25"><title id="dimensions-title">The dimensions of an offset</title><desc id="dimensions-desc">A quarter-turn band is generated by concentric radii 120 and 80. Its width is seven units, its offset is one unit, and its radius leader meets the actual outer arc.</desc><metadata>Geometric teaching construction after approved P02. Native 560 × 440; u=40. Center(280,248); outer radius120=3u, inner radius80=2u; band offset40=u. Horizontal left x120 and right x400 give total width280=7u. No physical material or load claim. Radius leader ends at(280+120/sqrt(2),248-120/sqrt(2)). Principal arcs and generating-circle remainders have separate stroke ownership.</metadata><path d="M120 128H280A120 120 0 0 1 400 248V344H360V248A80 80 0 0 0 280 168H120Z" fill="none" stroke="currentColor" stroke-width="0.95" stroke-opacity="1" /><path d="M400 248A120 120 0 1 1 280 128M360 248A80 80 0 1 1 280 168" fill="none" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.24" /><path d="M280 104V124M280 134V242M280 254V388M136 248H274M286 248H428" fill="none" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.24" stroke-dasharray="8 3 1 3" /><circle cx="280" cy="248" r="2.5" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><path d="M120 116V72M400 236V72" fill="none" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.24" data-grammar-focus="true" /><path d="M120 80H251.0M269.0 80H400" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><path d="M116 84l8 -8" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><path d="M396 84l8 -8" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><text x="260" y="83" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" opacity="0.5" data-grammar-focus="true">7u</text><path d="M360 352V388M400 352V388" fill="none" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.24" data-grammar-focus="true" /><path d="M360 380H371.0M389.0 380H400" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><path d="M356 384l8 -8" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><path d="M396 384l8 -8" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><text x="380" y="383" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" opacity="0.5" data-grammar-focus="true">u</text><path d="M281.767767 246.232233L364.852814 163.147186" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><path d="M358.852814 163.147186L364.852814 163.147186L364.852814 169.147186" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" data-grammar-focus="true" /><text x="325" y="195" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" opacity="0.5" transform="rotate(-45 325 195)" data-grammar-focus="true">R120</text><text x="176" y="157" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" opacity="0.66">Offset</text><text x="280" y="414" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" opacity="0.5">u = 40</text><circle cx="280" cy="128" r="2.5" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" /><circle cx="400" cy="248" r="2.5" fill="none" stroke="currentColor" stroke-width="0.65" stroke-opacity="0.5" /></svg>
