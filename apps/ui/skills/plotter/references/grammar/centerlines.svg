<svg xmlns="http://www.w3.org/2000/svg" id="plotter-grammar-centerlines" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" role="img" aria-labelledby="centerlines-title centerlines-desc" style="font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:&quot;GEOM&quot; 25"><title id="centerlines-title">Six slots, one center</title><desc id="centerlines-desc">Six curved slots share a pitch circle and one center. Three centerlines locate their radial midpoints, with a sixty-degree angle establishing the repeating interval.</desc><metadata>Geometric teaching construction after P00 circular construction. Native560×440. Ring center(280,220), outerR132 and innerR40. Six curved slots at angular centers -90,-30,30,90,150,210 degrees; centerline radius92, inner84, outer100, roundcapR8. Each spans30°; centers repeat60°. This is a planar repetition study, not a manufactured part specification. Centerlines and theoretical pitch circle use house8 3 1 3 dash; angle witness centered on(280,220) and attached to two true radial midlines.</metadata><circle cx="280" cy="220" r="132" fill="none" stroke="currentColor" stroke-width="0.95" stroke-opacity="1"/><circle cx="280" cy="220" r="40" fill="none" stroke="currentColor" stroke-width="0.95" stroke-opacity="1"/><path d="M254.118095 123.407417A100 100 0 0 1 305.881905 123.407417A8 8 0 0 1 301.7408 138.862231A84 84 0 0 0 258.2592 138.862231A8 8 0 0 1 254.118095 123.407417Z" fill="none" stroke="currentColor" stroke-width="0.95" stroke-opacity="1"/><path d="M350.710678 149.289322A100 100 0 0 1 376.592583 194.118095A8 8 0 0 1 361.137769 198.2592A84 84 0 0 0 339.39697 160.60303A8 8 0 0 1 350.710678 149.289322Z" fill="none" stroke="currentColor" stroke-width="0.95" stroke-opacity="1"/><path d="M376.592583 245.881905A100 100 0 0 1 350.710678 290.710678A8 8 0 0 1 339.39697 279.39697A84 84 0 0 0 361.137769 241.7408A8 8 0 0 1 376