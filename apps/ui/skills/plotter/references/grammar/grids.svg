<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" style="font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400" role="img" aria-labelledby="grammar-grids-title grammar-grids-desc"><title id="grammar-grids-title">A letter on its module</title><desc id="grammar-grids-desc">A modular letter P is constructed with a 32-unit stem, a 96-unit outer bowl radius, and a 64-unit counter radius. The 32-unit grid locates their shared steps.</desc><metadata>Plotter visual grammar: grids. Approved references: T01 for letter anatomy, P00 for a visible generating field. Native 560 × 440. Local unit u=32. Stem x184..216, y96..352; outside bowl center(280,192), R96=3u; counter R64=2u. The primary letter has no solid fill. The useful grid begins(152,64), pitch 32, and is split around coincident outline segments. A grid is used because the stem, counter, heights and radii share the actual unit field, not merely because the subject is geometric.</metadata><path d="M152 64L152 368" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M184 64L184 96" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M184 352L184 360" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M216 64L216 128" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M216 256L216 288" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M216 352L216 360" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M248 64L248 368" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M280 64L280 188" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M280 196L280 368" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/><path d="M312 64L312 368" stroke-width="0.6" opacity="0.1" data-grammar-focus="true"/>