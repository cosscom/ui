<title id="plotter-grammar-arrows-title">A quarter turn, directed</title><desc id="plotter-grammar-arrows-desc">One rigid capsule rotates from a solid horizontal pose into its dashed vertical proposal. The arrow follows a true quarter circle and points toward the proposed position.</desc><metadata>Plotter teaching construction, native560×440. References: P00 radius and orthogonal geometry; E02 curved path; C01 preserved fragment geometry. u=24 SVG units. Capsule end centers are(200,284),(392,284), separation192=8u; radius24, width48=2u. Proposed pose is a90° counterclockwise rotation about(200,284), taking the right center to(200,92). The R216 transfer arc is outside the moving part. R64 angle witness shares the pivot. Motion dash4 6 and solid open6-unit45°legs. This is a geometric movement illustration, not a load-bearing mechanism specification.</metadata>
