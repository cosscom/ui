<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" style="color:#171717;font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400" role="img" aria-labelledby="craft-tiles-title craft-tiles-desc"><title id="craft-tiles-title">One shared corner</title><desc id="craft-tiles-desc">Four tiles meet around a common circular opening and a constant joint width.</desc><metadata>Revision 2, catalog candidate. Reference: P00, C02. Flat tiling construction. Four 128-unit square allocations surround a 32-unit cross joint. A shared R48 circle cuts their inner corners; its remaining arcs appear only within the joint, so no locus segment retraces a tile edge. Overall extent 288 × 288. The four quarter turns place tiles in one plane and do not introduce perspective.</metadata><g transform="rotate(0 280 224)"><path d="M136 80H264V178.745166A48 48 0 0 0 234.745166 208H136Z" stroke-width="0.95" opacity="1"/></g><g transform="rotate(90 280 224)"><path d="M136 80H264V178.745166A48 48 0 0 0 234.745166 208H136Z" stroke-width="0.95" opacity="1"/></g><g transform="rotate(180 280 224)"><path d="M136 80H264V178.745166A48 48 0 0 0 234.745166 208H136Z" stroke-width="0.95" opacity="1"/></g><g transform="rotate(270 280 224)"><path d="M136 80H264V178.745166A48 48 0 0 0 234.745166 208H136Z" stroke-width="0.95" opacity="1"/></g><path d="M325.254834 208.000000A48 48 0 0 1 325.254834 240.000000" stroke-width="0.6" opacity="0.24" stroke-dasharray="8 3 1 3"/><path d="M296.000000 269.254834A48 48 0 0 1 264.000000 269.254834" stroke-width="0.6" opacity="0.24" stroke-dasharray="8 3 1 3"/><path d="M234.745166 240.000000A48 48 0 0 1 234.745166 208.000000" stroke-width="0.6" opacity="0.24" stroke-dasharray="8 3 1 3"/><path d="M264.000000 178.745166A48 48 0 0 1 296.000000 178.745166" stroke-width="0.6" opacity="0.24" stroke-dasharray="8 3 1 3"/><path d="M120 224H277M336 224H440M280 72V221M280 227V380" stroke-width="0.6" opacity="0.24" stroke-dasharray="8 3 1 3"/><circle cx="280" cy="224" r="3" stroke-width="0.65" opacity="0.5"/><path d="M283 224L328 224" stroke-width="0.65" opacity="0.5"/><path d="M323.757359 219.757359L328 224L323.757359 228.242641" stroke-width="0.65" opacity="0.5"/><text x="306" y="212" fill="currentColor" stroke="none" font-size="10" opacity="0.5" text-anchor="middle">R48</text><path d="M264 72V40M296 72V40M264 48H296M260 52L268 44M292 52L300 44" stroke-width="0.65" opacity="0.5"/><text x="280" y="36" fill="currentColor" stroke="none" font-size="10" opacity="0.5" text-anchor="middle">32</text><path d="M136 376V416M424 376V416" stroke-width="0.6" opacity="0.24"/><path d="M136 400V416M424 400V416M136 408H266.0M294.0 408H424M132 412L140 404M420 412L428 404" stroke-width="0.65" opacity="0.5"/><text x="280.0" y="411" fill="currentColor" stroke="none" font-size="10" opacity="0.5" text-anchor="middle">288</text></svg>
