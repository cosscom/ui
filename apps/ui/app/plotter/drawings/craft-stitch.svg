<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" style="color:#171717;font-family:Cal Sans,sans-serif;font-optical-sizing:auto;font-synthesis:none;font-variation-settings:'GEOM' 25;font-weight:400" role="img" aria-labelledby="craft-stitch-title craft-stitch-desc"><title id="craft-stitch-title">A seam, joined</title><desc id="craft-stitch-desc">Repeated crossed stitches bridge two edges on one shared hole pitch.</desc><metadata>Revision 2, catalog candidate. Reference: K07, C02. Conceptual front view of a stitched seam. Hole centers repeat every 48 units and sit 16 units from the joined edge. Thread segments end on the hole circumferences. One diagonal is interrupted at each crossing to preserve over/under meaning. The construction is illustrative, not a sewing specification.</metadata><path d="M224 104V344M336 104V344" stroke-width="0.95" opacity="1"/><path d="M224 104H128V344H224M336 104H432V344H336" stroke-width="0.65" opacity="0.5"/><circle cx="208" cy="128" r="4" stroke-width="0.65" opacity="0.5"/><circle cx="352" cy="128" r="4" stroke-width="0.65" opacity="0.5"/><circle cx="208" cy="176" r="4" stroke-width="0.95" opacity="1"/><circle cx="352" cy="176" r="4" stroke-width="0.95" opacity="1"/><circle cx="208" cy="224" r="4" stroke-width="0.95" opacity="1"/><circle cx="352" cy="224" r="4" stroke-width="0.95" opacity="1"/><circle cx="208" cy="272" r="4" stroke-width="0.65" opacity="0.5"/><circle cx="352" cy="272" r="4" stroke-width="0.65" opacity="0.5"/><circle cx="208" cy="320" r="4" stroke-width="0.65" opacity="0.5"/><circle cx="352" cy="320" r="4" stroke-width="0.65" opacity="0.5"/><path d="M211.79473319220205 129.26491106406735L348.20526680779795 174.73508893593265" stroke-width="0.65" opacity="0.5"/><path d="M348.20526680779795 129.26491106406735L283.79473319220205 150.73508893593265" stroke-width="0.65" opacity="0.5"/><path d="M276.205266807797